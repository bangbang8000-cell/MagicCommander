name: CI
on:
  push:
    branches: [main]
  pull_request:
  # 4.0.0-F0-1：支持手动触发 CI（验证 golden/模板/性能/安全基线步骤等）
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: npm ci --ignore-scripts
      - run: pip install -r backend/requirements.txt
      - run: pip install -r ai_hub/requirements.txt
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check-version
      # 4.0.0-F0-2：发布说明自动抽取并入版本脚本（check-version 门禁已覆盖 CHANGELOG 版本段）
      - run: npm run release-notes
      # 4.0.0-F0-1（40-a）：渲染层安全基线 —— 0 Node/主进程直连 + 网络请求仅限白名单模块
      # （MC 云平台集成合法使用 fetch，故按白名单适配，区别于 AL 的 0 网络）
      - name: Security baseline (renderer IPC-only + network allowlist)
        run: |
          # 仅扫描打包进渲染层的源码；src/test 为测试代码（合法使用 Node API），不属渲染层，排除
          if grep -rEn --exclude-dir=test "\brequire\(|process\.|ipcRenderer|ipcMain|contextBridge|child_process|spawn\(" src --include="*.ts" --include="*.tsx"; then
            echo "FAIL: renderer must not access Node/main-process APIs directly"
            exit 1
          fi
          if grep -rEn --exclude-dir=test "\bfetch\(" src --include="*.ts" --include="*.tsx" | grep -vE "src/api/|src/stores/platform.store.ts|src/components/cloud/CloudStatusIndicator.tsx|src/components/sidebar/SettingsPanel.tsx|src/editor/jinja-textmate.ts"; then
            echo "FAIL: renderer network calls outside whitelisted modules (src/api + platform/cloud/settings 既有白名单)"
            exit 1
          fi
          echo "PASS: renderer is isolated (IPC-only + whitelisted network)"
      - run: npm test
      - run: npm run build
      # 4.0.0-F0-1（40-b）：模板校验门禁 —— 模板库损坏时构建失败
      - run: python scripts/validate_templates.py
      # 5.0.1（501-c）：设备库校验门禁 —— id 唯一/字段完整/protocol/角色映射/AL 对账
      - run: python scripts/validate_device_library.py
      # 4.9.0（49-d）：AIDC 示例自动化验收 —— 打开/渲染/导出/回灌幂等/golden 确定性
      - run: python scripts/validate_samples.py
      # 4.0.0-F0-1（40-b）：golden 基线比对 —— 渲染文本/批次清单结构变化时 CI 失败
      - run: python scripts/gen_golden.py --check
      # 4.0.0-F0-1（40-c）：性能门禁 —— 批量渲染/单项目全量渲染超阈值退出码 1
      - run: python scripts/bench_perf.py --rounds 1
      # 4.5.0（45-a）：数据准确性校验门禁 —— 一致性/导出核对/IP 规划（有 error 即失败）
      - run: python scripts/validate_consistency.py --check
      - run: cd backend && python3 -m pytest tests/ -v
      - run: python3 -m pytest ai_hub/tests/ -v

  # 4.6.0（46-a / Q-1）：覆盖率门禁 —— 后端 --cov-fail-under（阈值单一来源）+ 前端 vitest --coverage（配置强制阈值）+ 棘轮只升不降
  coverage:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: npm ci --ignore-scripts
      - run: pip install -r backend/requirements.txt
      - run: pip install -r ai_hub/requirements.txt
      # 后端覆盖率门禁：阈值来自 tests/coverage_thresholds.json（backend.fail_under，只升不降）
      - name: Backend coverage gate
        run: |
          COV_BACKEND=$(python3 -c "import json;print(json.load(open('tests/coverage_thresholds.json'))['backend']['fail_under'])")
          python3 -m pytest backend/tests ai_hub/tests -q \
            --cov=backend --cov=ai_hub --cov-fail-under=$COV_BACKEND \
            --cov-report=json:reports/coverage/backend/coverage.json
      # 前端覆盖率门禁：阈值由 vite.config.ts（frontend.thresholds）强制，低于阈值 vitest 失败
      - run: npx vitest run --coverage
      # 棘轮只升不降：当前覆盖率不得低于 tests/coverage_baseline.json 锚点（下降即失败）
      - name: Coverage ratchet (only-up)
        run: python3 scripts/check_coverage_baseline.py
      # 统一质量测试报告（复用上述覆盖率产物，生成 reports/quality_report.json + HTML）
      - name: Generate quality report
        run: python3 scripts/test_report.py --skip-run

  # 4.0.0-F0-1（40-a / G-1）：Electron E2E —— 启动→建项目→渲染→导出 冒烟三件套
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: npm ci
      # 业务链路 E2E 的 render:project 走 Python 后端（读 Excel + Jinja2 渲染）
      - run: pip install -r backend/requirements.txt
      - run: pip install -r ai_hub/requirements.txt
      # E2E 启动需 dist-electron/main.js（package.json main 入口），先编译主进程/preload
      - run: npm run build:electron
      # E2E 以 dev 模式启动（playwright webServer 拉起 vite :5173）
      # Electron 系统依赖（libgtk 等）；electron 二进制随 npm ci 安装
      # 508-b: install-deps 为历史上反复卡死的环境性步骤 → 失败重试 3 次 + 步骤超时护栏
      - name: Install Playwright system deps (retry guard)
        retry-on: failure
        max-attempts: 3
        timeout-minutes: 15
        run: sudo npx playwright install-deps
      # 508-b: Electron E2E 加上限超时与失败重试，降低环境性 red
      - name: Run Electron E2E (retry guard)
        retry-on: failure
        max-attempts: 3
        timeout-minutes: 30
        run: xvfb-run --auto-servernum npx playwright test
